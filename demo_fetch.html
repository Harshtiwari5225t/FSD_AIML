<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo_fetch_in_js</title>
    <style>
        table{
            width:80%;
            margin:auto;
            padding: 10px;
            font-size: 125%;
            background-color: wheat;
            color:violet;
            border: 4px solid blueviolet;
        }
    </style>
    
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>SR. NO.</th>
                <th>TITLE</th>
                <th>CATEGORY.</th>
                <th>PRICE</th>
                <th>RATING</th>
                <th>STOCK</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele =document.getElementById("data");
        const URL="https://dummyjson.com/products?limit=100&skip=1";
        async function loadproduct() {
            
            try{
                const res=await fetch(URL);
                const data=await res.json();
                console.log("DATA",data.products);
                let row="";

                data.products.map((i,index)=>{
                    row+=`
                    <tr>
                        <td>${index}</td>
                        <td>${i.title}</td>
                        <td>${i.category}</td>
                        <td>${i.price}₹</td>
                        <td>${i.rating}</td>
                        <td>${i.stock}</td>
                    </tr>
                    `;
                    ele.innerHTML=row;
                })
            }
            catch(err){
                console.log("ERROR ",err );
            }
        }
        loadproduct();
    </script>
</body>
</html>
